# pnpm 11 起，onlyBuiltDependencies 从 package.json 的 "pnpm" 字段搬到了这里。
# electron 需要跑 postinstall 下载二进制，否则 node_modules\electron\dist 是空的。
onlyBuiltDependencies:
  - electron

# 这两个的构建脚本我们明确不要，列出来免得 pnpm 每次 install 都报
# ERR_PNPM_IGNORED_BUILDS 并以退出码 1 结束（CI 上会直接把构建判失败）。
#   - esbuild：平台二进制走 @esbuild/<plat> 的 optionalDependencies，postinstall 只是校验
#   - electron-winstaller：Squirrel/Windows 安装器的辅助包，我们只用 NSIS，用不上
ignoredBuiltDependencies:
  - esbuild
  - electron-winstaller

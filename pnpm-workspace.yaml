# pnpm 11 的依赖构建脚本白名单。
#
# 11.28 起用的是 `allowBuilds`（包名 → true/false 的映射），不再是 10.x 的
# `onlyBuiltDependencies` 列表 —— 用旧名字 pnpm 会当作没配，把脚本全跳过，
# 然后以 ERR_PNPM_IGNORED_BUILDS + 退出码 1 结束（CI 上直接判构建失败）。
#
# 这个映射由 `pnpm approve-builds` 维护，也可以手改。
allowBuilds:
  # Electron 44 的 package.json 里没有 scripts 字段，二进制靠
  # node_modules/electron/index.js 首次调用时惰性下载；CI 里我们显式跑
  # `node node_modules/electron/install.js`，本地也跑一次。
  electron: true
  # 平台二进制走 @esbuild/<plat> 的 optionalDependencies，postinstall 只是校验
  esbuild: true
  # electron-builder 的 Squirrel 辅助包。我们只用 NSIS，但它的脚本无害
  electron-winstaller: true
# pnpm 11 会拦「发布不满一个最小年龄」的新版本（supply-chain 策略）。
# 这几个是 2026-10 刚发的新版，pnpm 自动记进这里的白名单；删了下次
# install 还会被它重新加上，所以留着。
minimumReleaseAgeExclude:
  - '@lucide/vue@1.60.0'
  - electron-updater@6.8.11
  - electron@44.9.2

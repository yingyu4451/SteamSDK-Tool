appId: com.yingyu.steamsdktool
# 产品名用 ASCII：它会参与安装路径和 exe 文件名，中文容易在某些环境出问题。
# 真正给用户看的名字走窗口标题和 nsis.shortcutName（中文）。
productName: SteamSDK Tool
copyright: Copyright © 2026 YingYu

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# 不需要打进包里的调试脚本
extraMetadata:
  main: out/main/index.js

# 任务栏 / 窗口图标要在运行时按真实路径读到（BrowserWindow 的 icon 不收 asar 内的虚拟路径）
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

win:
  target:
    # setup：走安装向导，能改安装目录、建快捷方式、能自动更新
    - target: nsis
      arch:
        - x64
    # portable：单个 exe，双击就跑，不装、不写注册表、不需要管理员
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  # 名字里带 portable，别让更新逻辑把它当成安装包
  # （updater 挑资产时优先选名字含 setup 的那个）
  artifactName: ${productName}-${version}-portable.${ext}
  # 不申请管理员权限：便携版的意义就是解压即用
  requestExecutionLevel: user
  unpackDirName: SteamSDKTool

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SteamSDK 上传工作台
  uninstallDisplayName: SteamSDK 上传工作台
  deleteAppDataOnUninstall: false
  # 安装包 / 卸载程序自己的图标
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
